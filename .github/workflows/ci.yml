name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    env:
      DEVSPACE_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          # pnpm 11 requires Node >=22.19; keep the tested runtime reproducible.
          runtime: node@22.23.2
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Pi sandbox dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap socat
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Typecheck
        id: typecheck
        run: pnpm typecheck

      - name: Test
        id: test
        env:
          DEVSPACE_REQUIRE_PI_SANDBOX: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
        run: pnpm test

      # The receipt runner writes TAP diagnostics to disk, not stdout. Retain
      # only its logs/receipts, never its isolated Codex home or other state.
      - name: Preserve test diagnostics
        if: ${{ !cancelled() && steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-diagnostics-${{ matrix.os }}
          path: |
            releases/test-receipts/*.log
            releases/test-receipts/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Package install smoke test
        id: package
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm test:package-install

      - name: Doctor
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: node dist/cli.js doctor
